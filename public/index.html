<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        #viewerContainer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; overflow: hidden; }

        /* --- CSS TĂNG TỐC --- */
        #ttViewer { display: none; width: 100%; height: 100%; position: relative; color: white; }
        #ttBgVideo { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; z-index: 0; }
        #ttWaitingImg { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; z-index: 100; }
        #ttTimerVideo { position: absolute; bottom: 2%; right: 2%; width: 15%; z-index: 10; mix-blend-mode: screen; }
        #ttQuestionBox { position: absolute; top: 4%; left: 5%; width: 90%; height: 18%; display: flex; align-items: center; justify-content: center; z-index: 10; }
        #ttQuestionText { font-size: 3vw; font-weight: bold; text-align: center; text-transform: uppercase; text-shadow: 2px 2px 4px black; }
        #ttDataBox { position: absolute; top: 24%; left: 5%; width: 90%; height: 70%; display: flex; align-items: center; justify-content: center; z-index: 10; }
        #ttDataContent { font-size: 5vw; color: #ffeb3b; font-weight: bold; text-shadow: 2px 2px 4px black; }
        #ttDataImage { max-width: 100%; max-height: 100%; object-fit: contain; }
        #ttBuzzerOverlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 50; }
        #ttBuzzerFrame { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); width: 60%; animation: bounceIn 0.5s; }
        #ttBuzzerImg { width: 100%; border: 4px solid white; border-radius: 15px; box-shadow: 0 0 30px white; }
        #ttPlayerName { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4vw; font-weight: 900; color: white; text-transform: uppercase; text-shadow: 2px 2px 0 #000; width: 100%; text-align: center; }

        /* --- CSS Ô MẠO HIỂM (CŨ) --- */
        #vncvViewer { display: none; width: 100%; height: 100%; position: relative; background: white; color: black; }
        #vncvBg { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #vncvContent { position: absolute; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .vncv-question { background: rgba(0,0,139,0.9); color: white; padding: 30px; font-size: 3rem; border-radius: 20px; text-align: center; max-width: 90%; border: 5px solid gold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #vncvTimer { font-size: 8rem; color: red; font-weight: bold; margin-top: 30px; }

        /* --- CSS BUTTON TĂNG TỐC --- */
        .buzz-btn { width: 250px; height: 250px; border-radius: 50%; border: 8px solid #ccc; font-size: 2rem; font-weight: bold; background: #444; color: #aaa; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .buzz-btn.active { background: #dc3545; border-color: #ff6b6b; color: white; cursor: pointer; box-shadow: 0 0 30px rgba(220, 53, 69, 0.8); }

        @keyframes bounceIn { 0% { transform: translateX(-50%) scale(0.3); opacity: 0; } 50% { transform: translateX(-50%) scale(1.05); opacity: 1; } 100% { transform: translateX(-50%) scale(1); } }
    </style>
</head>
<body>

    <div id="loginScreen" class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="text-center">ĐĂNG NHẬP</h3>
                <input type="text" id="roomId" class="form-control mb-2" placeholder="Tên phòng" value="OLYMPIA">
                <input type="text" id="playerName" class="form-control mb-2" placeholder="Tên của bạn">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" onclick="joinGame('HOST')">HOST</button>
                    <button class="btn btn-success" onclick="joinGame('PLAYER')">THÍ SINH</button>
                    <button class="btn btn-secondary" onclick="joinGame('VIEWER')">VIEWER</button>
                    <button class="btn btn-info" onclick="joinGame('MC')">MC</button>
                </div>
            </div>
        </div>
    </div>

    <div id="hostScreen" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>🎛️ HOST CONTROL</h2>
            <div>
                <span class="badge bg-info p-2" id="roundLabel">...</span>
                <button class="btn btn-warning ms-2" onclick="location.reload()">Thoát</button>
            </div>
        </div>

        <div class="card mb-3 border-dark">
            <div class="card-body bg-light">
                <h5>🔀 CHỌN VÒNG:</h5>
                <button class="btn btn-outline-primary fw-bold" onclick="switchRound('VNCV')">Ô MẠO HIỂM</button>
                <button class="btn btn-outline-danger fw-bold" onclick="switchRound('TANGTOC')">TĂNG TỐC</button>
            </div>
        </div>

        <div id="ctrlVNCV" style="display: none;">
            <div class="card border-primary">
                <div class="card-header bg-primary text-white">ĐIỀU KHIỂN: Ô MẠO HIỂM</div>
                <div class="card-body">
                    <div class="mb-3">
                        <input type="text" id="vncvQ" class="form-control" placeholder="Nhập câu hỏi...">
                        <button class="btn btn-info mt-2" onclick="socket.emit('updateVncvQuestion', {roomId: myRoomId, text: document.getElementById('vncvQ').value})">Hiện câu hỏi</button>
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-success me-2" onclick="controlMedia('startTimer', 15)">⏱️ 15s (Mở khóa)</button>
                        <button class="btn btn-warning me-2" onclick="controlMedia('startTimer', 30)">⏱️ 30s (Mở khóa)</button>
                        <button class="btn btn-danger" onclick="controlMedia('stop')">⏹️ Dừng/Khóa</button>
                    </div>
                    <h6>Danh sách trả lời:</h6>
                    <ul class="list-group" id="vncvAnswerList"></ul>
                </div>
            </div>
        </div>

        <div id="ctrlTangToc" style="display: none;">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">ĐIỀU KHIỂN: TĂNG TỐC</div>
                <div class="card-body">
                    <div class="mb-2">
                        <input type="text" id="ttInputText" class="form-control mb-1" placeholder="Câu hỏi...">
                        <input type="text" id="ttInputData" class="form-control" placeholder="Dữ kiện (Link ảnh/Text)">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success" onclick="ttAction('start')">▶️ BẮT ĐẦU</button>
                        <button class="btn btn-warning" onclick="ttAction('continue')">⏯️ SAI/TIẾP</button>
                        <button class="btn btn-secondary" onclick="ttAction('reset')">⏹️ RESET</button>
                    </div>
                    <div class="mt-3 alert alert-secondary">
                        <strong>Buzz: </strong> <span id="ttBuzzedName" class="text-danger fw-bold">...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="playerScreen" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center">
            <h4 id="pNameDisplay">Thí sinh</h4>
            <button class="btn btn-sm btn-outline-secondary" onclick="requestFullscreen()">Full Screen</button>
        </div>
        <hr>

        <div id="pVNCV" style="display: none;">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title mb-3">VƯỢT CHƯỚNG NGẠI VẬT</h5>
                    
                    <div id="pQuestion" class="alert alert-info fw-bold" style="min-height: 60px;">
                        </div>

                    <div id="inputStatus" class="small text-end mb-2 fw-bold text-muted">
                        </div>

                    <input type="text" id="answerInput" class="form-control form-control-lg text-center mb-3" placeholder="Nhập đáp án..." disabled>
                    
                    <button class="btn btn-primary w-100 py-3" onclick="submitVncvAnswer()">GỬI ĐÁP ÁN</button>
                    
                    <div class="mt-3 text-success fw-bold">
                        Đã gửi: <span id="pSubmitted">...</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="pTangToc" class="d-flex flex-column align-items-center" style="display: none;">
            <h3 class="mb-4">VÒNG TĂNG TỐC</h3>
            <button id="ttBuzzBtn" class="buzz-btn" onclick="ttPlayerBuzz()">BẤM CHUÔNG</button>
            <h3 id="ttStatusMsg" class="mt-4 text-info"></h3>
        </div>
    </div>

    <div id="mcScreen" class="container mt-4" style="display: none;">
        <h2>🎤 GIAO DIỆN MC</h2>
        <div class="card mt-3">
            <div class="card-body text-center">
                <h1 class="display-1 fw-bold text-primary" id="mcBigText">...</h1>
                <h3 class="text-secondary" id="mcSubText"></h3>
            </div>
        </div>
    </div>

    <div id="viewerContainer">
        <div id="ttViewer">
            <img id="ttWaitingImg" src="/waiting_bg.jpg">
            <video id="ttBgVideo" loop muted><source src="/question_bg.mp4" type="video/mp4"></video>
            <video id="ttTimerVideo" muted playsinline><source src="/timer.mp4" type="video/mp4"></video>
            <div id="ttQuestionBox"><div id="ttQuestionText"></div></div>
            <div id="ttDataBox">
                <div id="ttDataContent"></div>
                <img id="ttDataImage" src="" style="display:none;">
            </div>
            <div id="ttBuzzerOverlay">
                <div id="ttBuzzerFrame">
                    <img id="ttBuzzerImg" src="/buzzer_frame.png">
                    <div id="ttPlayerName"></div>
                </div>
            </div>
        </div>
        <div id="vncvViewer">
            <img id="vncvBg" src="/waiting_bg.jpg" style="opacity: 0.3;"> 
            <div id="vncvContent">
                <div class="vncv-question" id="vncvViewerQ">CHỜ CÂU HỎI...</div>
                <h1 id="vncvTimer"></h1>
            </div>
        </div>
        <audio id="sfxBuzzer" src="/buzzer_sound.mp3"></audio>
        <audio id="sfxTimer15" src="/timer15.mp3"></audio>
        <audio id="sfxTimer30" src="/timer30.mp3"></audio>
    </div>

    <script>
        const socket = io();
        let myRole = '', myRoomId = '', myId = '';

        function joinGame(role) {
            const r = document.getElementById('roomId').value;
            const n = document.getElementById('playerName').value;
            if(!r) return alert("Thiếu tên phòng");
            myRole = role; myRoomId = r;
            socket.emit('joinRoom', { roomId: r, playerName: n||role, isHost: role==='HOST', isViewer: role==='VIEWER', isMC: role==='MC' });
            
            document.getElementById('loginScreen').style.display = 'none';
            if(role==='HOST') document.getElementById('hostScreen').style.display='block';
            if(role==='MC') document.getElementById('mcScreen').style.display='block';
            if(role==='PLAYER') {
                document.getElementById('playerScreen').style.display='block';
                document.getElementById('pNameDisplay').innerText = "Thí sinh: " + n;
                // Check fullscreen loop cho logic cũ
                setInterval(checkFullscreenLogic, 1000); 
            }
            if(role==='VIEWER') document.getElementById('viewerContainer').style.display='block';
        }

        socket.on('connect', () => myId = socket.id);

        socket.on('updateState', (room) => {
            updateRoundUI(room);
            if(myRole==='VIEWER') renderViewer(room);
            if(myRole==='HOST') renderHost(room);
            if(myRole==='PLAYER') renderPlayer(room);
            if(myRole==='MC') renderMC(room);
        });

        socket.on('mediaControl', (data) => {
            if(myRole === 'VIEWER') {
                if(data.action === 'startTimer') {
                    document.getElementById('vncvTimer').innerText = data.duration;
                    let count = data.duration;
                    const interval = setInterval(() => {
                        count--;
                        document.getElementById('vncvTimer').innerText = count;
                        if(count <= 0) { clearInterval(interval); document.getElementById('vncvTimer').innerText = "HẾT GIỜ"; }
                    }, 1000);
                    const audio = (data.duration === 15) ? document.getElementById('sfxTimer15') : document.getElementById('sfxTimer30');
                    if(audio) { audio.currentTime = 0; audio.play().catch(()=>{}); }
                } else if(data.action === 'stop') {
                    document.getElementById('vncvTimer').innerText = "";
                    ['sfxTimer15', 'sfxTimer30'].forEach(id => { const aud = document.getElementById(id); if(aud) { aud.pause(); aud.currentTime=0; } });
                }
            }
        });

        socket.on('playSound', (s) => {
            if(myRole === 'VIEWER' || myRole === 'HOST' || myRole === 'MC') {
                if(s==='buzzer') document.getElementById('sfxBuzzer').play();
            }
        });

        function updateRoundUI(room) {
            const isTT = room.roundType === 'TANGTOC';
            
            if(document.getElementById('hostScreen').style.display !== 'none') {
                document.getElementById('roundLabel').innerText = isTT ? "TĂNG TỐC" : "Ô MẠO HIỂM";
                document.getElementById('ctrlTangToc').style.display = isTT ? 'block' : 'none';
                document.getElementById('ctrlVNCV').style.display = isTT ? 'none' : 'block';
            }
            if(document.getElementById('playerScreen').style.display !== 'none') {
                document.getElementById('pTangToc').style.display = isTT ? 'flex' : 'none';
                document.getElementById('pVNCV').style.display = isTT ? 'none' : 'block';
            }
        }

        // --- RENDER PLAYER (QUAN TRỌNG: LOGIC CŨ ĐƯỢC KHÔI PHỤC TẠI ĐÂY) ---
        let currentRoomState = null; // Lưu state để check fullscreen loop dùng
        function renderPlayer(room) {
            currentRoomState = room; // Cập nhật state mới nhất
            
            if(room.roundType === 'TANGTOC') {
                // Logic Tăng tốc mới
                const btn = document.getElementById('ttBuzzBtn');
                const msg = document.getElementById('ttStatusMsg');
                const st = room.tangtoc;
                
                btn.className = "buzz-btn"; msg.innerText="";
                if(st.status==='SHOW_QUESTION') { btn.classList.add('active'); btn.disabled=false; msg.innerText="BẤM ĐI!"; }
                else if(st.status==='BUZZED') { 
                    btn.disabled=true; 
                    msg.innerText = (st.buzzedPlayer?.id===myId) ? "BẠN ĐÃ GIÀNH QUYỀN!" : `${st.buzzedPlayer?.name} ĐÃ BẤM`;
                    if(st.buzzedPlayer?.id===myId) btn.style.background="green";
                }
                else { btn.disabled=true; msg.innerText="Chờ..."; }
            } else {
                // === LOGIC VNCV CŨ ===
                const p = room.players[myId];
                const vncv = room.vncv;
                
                // Hiển thị câu hỏi
                const qBox = document.getElementById('pQuestion');
                if(vncv.question) {
                    // Nếu có targetPlayer và không phải mình -> Ẩn câu hỏi (Logic cũ của bạn)
                    if(vncv.targetPlayerId && vncv.targetPlayerId !== myId) qBox.innerText = ""; 
                    else qBox.innerText = vncv.question;
                } else { qBox.innerText = "Chờ câu hỏi..."; }

                // Hiển thị đáp án đã gửi
                if(p && p.lastAnswer) document.getElementById('pSubmitted').innerText = p.lastAnswer;
                else document.getElementById('pSubmitted').innerText = "...";

                // Logic check quyền nhập liệu được gọi liên tục bởi setInterval(checkFullscreenLogic)
                // để đảm bảo realtime khi người dùng bật/tắt fullscreen
            }
        }

        // Hàm loop kiểm tra điều kiện nhập liệu (Fullscreen + Logic server)
        function checkFullscreenLogic() {
            if(!currentRoomState || currentRoomState.roundType !== 'VNCV') return;

            const room = currentRoomState;
            const vncv = room.vncv;
            const input = document.getElementById('answerInput');
            const st = document.getElementById('inputStatus');
            
            let canType = false;
            let statusText = "Khóa";
            let statusClass = "text-muted";

            // Logic cũ của bạn:
            if (vncv.targetPlayerId) {
                if (vncv.targetPlayerId === myId && vncv.isInputOpen) {
                    canType = true; statusText = "Được phép trả lời"; statusClass = "text-success";
                }
            } else if (room.answerMode === 'unlocked') {
                canType = true; statusText = "Được phép trả lời chung"; statusClass = "text-primary";
            }

            // Check fullscreen
            if (!document.fullscreenElement) {
                canType = false; 
                statusText = "BỊ KHÓA: VUI LÒNG BẬT FULLSCREEN!"; 
                statusClass = "text-danger";
            }

            input.disabled = !canType;
            if(canType) input.focus();
            
            st.innerText = statusText;
            st.className = `small text-end mb-2 fw-bold ${statusClass}`;
        }

        function submitVncvAnswer() {
            const ans = document.getElementById('answerInput').value;
            socket.emit('submitAnswer', { roomId: myRoomId, answer: ans });
        }
        function requestFullscreen() { document.documentElement.requestFullscreen(); }

        // --- RENDER VIEWER ---
        function renderViewer(room) {
            const ttV = document.getElementById('ttViewer');
            const vncvV = document.getElementById('vncvViewer');
            if(room.roundType === 'TANGTOC') {
                ttV.style.display = 'block'; vncvV.style.display = 'none';
                const st = room.tangtoc;
                if(st.status === 'IDLE') {
                    document.getElementById('ttWaitingImg').style.display = 'block';
                    document.getElementById('ttTimerVideo').style.display = 'none';
                } else {
                    document.getElementById('ttWaitingImg').style.display = 'none';
                    document.getElementById('ttQuestionText').innerText = st.questionText;
                    const isImg = st.questionData.includes('http') || st.questionData.match(/\.(jpg|png)$/);
                    if(isImg) {
                        document.getElementById('ttDataImage').src=st.questionData;
                        document.getElementById('ttDataImage').style.display='block';
                        document.getElementById('ttDataContent').style.display='none';
                    } else {
                        document.getElementById('ttDataContent').innerText=st.questionData;
                        document.getElementById('ttDataContent').style.display='block';
                        document.getElementById('ttDataImage').style.display='none';
                    }
                    const tmr = document.getElementById('ttTimerVideo');
                    if(st.status === 'SHOW_QUESTION') {
                        tmr.style.display = 'block'; tmr.play().catch(()=>{});
                        document.getElementById('ttBuzzerOverlay').style.display='none';
                    } else if (st.status === 'BUZZED') {
                        tmr.pause();
                        if(st.buzzedPlayer) {
                            document.getElementById('ttBuzzerOverlay').style.display='block';
                            document.getElementById('ttPlayerName').innerText=st.buzzedPlayer.name;
                        }
                    }
                }
            } else {
                ttV.style.display = 'none'; vncvV.style.display = 'block';
                document.getElementById('vncvViewerQ').innerText = room.vncv.question || "CHỜ CÂU HỎI...";
            }
        }

        function renderMC(room) {
            if(room.roundType === 'TANGTOC') {
                if(room.tangtoc.buzzedPlayer) {
                    document.getElementById('mcBigText').innerText = room.tangtoc.buzzedPlayer.name;
                    document.getElementById('mcSubText').innerText = "Đã bấm chuông!";
                } else {
                    document.getElementById('mcBigText').innerText = "...";
                    document.getElementById('mcSubText').innerText = "Đang chờ...";
                }
            } else {
                document.getElementById('mcBigText').innerText = "VÒNG Ô MẠO HIỂM";
                document.getElementById('mcSubText').innerText = room.vncv.question;
            }
        }

        function renderHost(room) {
            if(room.roundType === 'VNCV') {
                const list = document.getElementById('vncvAnswerList');
                list.innerHTML = "";
                for(const pid in room.players) {
                    const p = room.players[pid];
                    if(!p.isHost && !p.isViewer && !p.isMC) {
                        const li = document.createElement('li');
                        li.className = "list-group-item d-flex justify-content-between";
                        li.innerHTML = `<span>${p.name}</span> <span class="fw-bold text-primary">${p.lastAnswer || "..."}</span>`;
                        list.appendChild(li);
                    }
                }
            } else {
                document.getElementById('ttBuzzedName').innerText = room.tangtoc.buzzedPlayer?.name || "...";
            }
        }

        function switchRound(t) { socket.emit('switchRound', {roomId: myRoomId, type: t}); }
        function ttAction(a) {
            const t = document.getElementById('ttInputText').value;
            const d = document.getElementById('ttInputData').value;
            socket.emit('ttControl', {roomId: myRoomId, action: a, data:{text:t, media:d}});
        }
        function ttPlayerBuzz() { socket.emit('ttBuzz', {roomId: myRoomId}); }
        function controlMedia(action, duration) { socket.emit('controlMedia', {roomId: myRoomId, action, duration}); }
    </script>
</body>
</html>
