<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 10px; }
        
        /* VIEWER (Màn hình lớn) */
        #viewerContainer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; overflow: hidden; }
        #vncvViewer { width: 100%; height: 100%; position: relative; }
        #vncvBg { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #vncvContent { position: absolute; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .vncv-question { background: rgba(0,0,139,0.9); color: white; padding: 30px; font-size: 3rem; border-radius: 20px; text-align: center; max-width: 90%; border: 5px solid gold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #vncvTimer { font-size: 8rem; color: red; font-weight: bold; margin-top: 30px; text-shadow: 2px 2px 0 white; }

        /* HOST & PLAYER */
        .card { border-radius: 15px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="text-center mb-4">ĐĂNG NHẬP</h3>
                <input type="text" id="roomId" class="form-control mb-3" placeholder="Tên phòng (VD: OLYMPIA)" value="OLYMPIA">
                <input type="text" id="playerName" class="form-control mb-3" placeholder="Tên của bạn">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" onclick="joinGame('HOST')">HOST (Điều khiển)</button>
                    <button class="btn btn-success" onclick="joinGame('PLAYER')">THÍ SINH</button>
                    <button class="btn btn-secondary" onclick="joinGame('VIEWER')">VIEWER (TV)</button>
                    <button class="btn btn-info" onclick="joinGame('MC')">MC</button>
                </div>
            </div>
        </div>
    </div>

    <div id="hostScreen" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🎛️ HOST CONTROL</h2>
            <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">Thoát</button>
        </div>

        <div class="card border-primary">
            <div class="card-header bg-primary text-white">ĐIỀU KHIỂN: Ô MẠO HIỂM</div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="vncvQ" class="form-control" placeholder="Nhập câu hỏi...">
                    <button class="btn btn-info" onclick="socket.emit('updateVncvQuestion', {roomId: myRoomId, text: document.getElementById('vncvQ').value})">Hiện câu hỏi</button>
                </div>
                <div class="mb-3">
                    <label class="fw-bold">Bấm giờ & Mở khóa:</label><br>
                    <button class="btn btn-success me-2" onclick="controlMedia('startTimer', 15)">⏱️ 15 Giây</button>
                    <button class="btn btn-warning me-2" onclick="controlMedia('startTimer', 30)">⏱️ 30 Giây</button>
                    <button class="btn btn-danger" onclick="controlMedia('stop')">⏹️ Dừng / Khóa</button>
                </div>
                <hr>
                <h6>Danh sách đáp án thí sinh:</h6>
                <ul class="list-group" id="vncvAnswerList"></ul>
            </div>
        </div>
    </div>

    <div id="playerScreen" class="container mt-4" style="display: none;">
        <h4 id="pNameDisplay" class="text-center mb-4 text-secondary">Thí sinh: ...</h4>

        <div class="card shadow-lg border-primary">
            <div class="card-header bg-primary text-white text-center fw-bold">TRẢ LỜI CÂU HỎI</div>
            <div class="card-body">
                <div id="pQuestion" class="alert alert-light border text-center fw-bold text-dark mb-3" style="min-height: 60px; font-size: 1.2rem;">
                    Chờ câu hỏi từ Host...
                </div>
                
                <div id="inputStatus" class="text-end mb-2 fw-bold text-danger small">ĐANG KHÓA</div>
                
                <input type="text" id="answerInput" class="form-control form-control-lg text-center mb-3" placeholder="Nhập đáp án..." disabled style="font-size: 1.5rem;">
                
                <button class="btn btn-primary btn-lg w-100 py-3 fw-bold" onclick="submitVncvAnswer()">GỬI ĐÁP ÁN</button>
                
                <div class="mt-3 text-center">
                    <span class="text-muted">Đã gửi: </span>
                    <span id="pSubmitted" class="fw-bold text-success fs-5">...</span>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <button class="btn btn-outline-secondary btn-sm" onclick="requestFullscreen()">⚠️ BẬT CHẾ ĐỘ TOÀN MÀN HÌNH (ĐỂ TRẢ LỜI)</button>
        </div>
    </div>

    <div id="mcScreen" class="container mt-4" style="display: none;">
        <h2>🎤 MC VIEW</h2>
        <div class="card mt-5 shadow border-0">
            <div class="card-body text-center p-5">
                <h1 class="display-1 fw-bold text-primary" id="mcBigText">...</h1>
                <h3 class="text-secondary mt-3" id="mcSubText"></h3>
            </div>
        </div>
    </div>

    <div id="viewerContainer">
        <div id="vncvViewer">
            <img id="vncvBg" src="/waiting_bg.jpg"> 
            <div id="vncvContent">
                <div class="vncv-question" id="vncvViewerQ">CHỜ CÂU HỎI...</div>
                <h1 id="vncvTimer"></h1>
            </div>
        </div>
        
        <audio id="sfxTimer15" src="/timer15.mp3"></audio>
        <audio id="sfxTimer30" src="/timer30.mp3"></audio>
    </div>

    <script>
        const socket = io();
        let myRole = '', myRoomId = '', myId = '';

        // === 1. HÀM JOIN GAME (ĐÃ FIX) ===
        function joinGame(role) {
            const r = document.getElementById('roomId').value;
            const n = document.getElementById('playerName').value;
            
            if(!r) return alert("Vui lòng nhập tên phòng!");
            if(role === 'PLAYER' && !n) return alert("Vui lòng nhập tên thí sinh!");

            myRole = role; 
            myRoomId = r;
            
            // Gửi yêu cầu lên server
            socket.emit('joinRoom', { roomId: r, playerName: n||role, isHost: role==='HOST', isViewer: role==='VIEWER', isMC: role==='MC' });
            
            // Ẩn màn hình đăng nhập
            document.getElementById('loginScreen').style.display = 'none';

            // Hiện màn hình tương ứng
            if(role === 'HOST') document.getElementById('hostScreen').style.display = 'block';
            if(role === 'MC') document.getElementById('mcScreen').style.display = 'block';
            if(role === 'VIEWER') document.getElementById('viewerContainer').style.display = 'block';
            
            // QUAN TRỌNG: Hiện màn hình Thí sinh
            if(role === 'PLAYER') {
                document.getElementById('playerScreen').style.display = 'block';
                document.getElementById('pNameDisplay').innerText = "Thí sinh: " + n;
                
                // Bật vòng lặp kiểm tra Fullscreen (Logic khóa/mở)
                setInterval(checkPlayerLogic, 500); 
            }
        }

        socket.on('connect', () => myId = socket.id);

        // Nhận thông báo lỗi từ server (nếu phòng chưa tạo)
        socket.on('errorMessage', (msg) => {
            alert(msg);
            location.reload(); // Tải lại trang để đăng nhập lại
        });

        // === 2. UPDATE TRẠNG THÁI TỪ SERVER ===
        socket.on('updateState', (room) => {
            // Logic HOST
            if(myRole === 'HOST') {
                const list = document.getElementById('vncvAnswerList');
                list.innerHTML = "";
                for(const pid in room.players) {
                    const p = room.players[pid];
                    if(!p.isHost && !p.isViewer && !p.isMC) {
                        list.innerHTML += `<li class="list-group-item d-flex justify-content-between">
                            <span>${p.name}</span>
                            <span class="fw-bold text-primary">${p.lastAnswer || "..."}</span>
                        </li>`;
                    }
                }
            }

            // Logic PLAYER
            if(myRole === 'PLAYER') {
                const p = room.players[myId];
                // Cập nhật câu hỏi
                const qBox = document.getElementById('pQuestion');
                if(room.vncv.question) {
                     // Nếu có chỉ định người chơi thì chỉ hiện cho người đó (Logic nâng cao), 
                     // ở đây hiện chung cho tất cả nếu không có chỉ định
                    qBox.innerText = room.vncv.question;
                } else {
                    qBox.innerText = "Chờ câu hỏi...";
                }
                // Cập nhật câu trả lời đã gửi
                document.getElementById('pSubmitted').innerText = (p && p.lastAnswer) ? p.lastAnswer : "...";
                
                // Lưu lại room hiện tại để dùng cho hàm checkPlayerLogic
                window.currentRoomState = room;
            }

            // Logic VIEWER
            if(myRole === 'VIEWER') {
                document.getElementById('vncvViewerQ').innerText = room.vncv.question || "CHỜ CÂU HỎI...";
            }

            // Logic MC
            if(myRole === 'MC') {
                document.getElementById('mcBigText').innerText = "Ô MẠO HIỂM";
                document.getElementById('mcSubText').innerText = room.vncv.question || "Chưa có câu hỏi";
            }
        });

        // === 3. LOGIC PLAYER (FULLSCREEN & KHÓA INPUT) ===
        function checkPlayerLogic() {
            // Lấy state phòng mới nhất
            const room = window.currentRoomState;
            if(!room) return;

            const input = document.getElementById('answerInput');
            const st = document.getElementById('inputStatus');
            
            let canType = false;
            let statusText = "ĐANG KHÓA";
            let statusClass = "text-danger";

            // 1. Kiểm tra Server có mở cổng không
            const serverOpen = (room.answerMode === 'unlocked' && room.vncv.isInputOpen);

            // 2. Kiểm tra Fullscreen
            const isFullscreen = document.fullscreenElement != null;

            if (serverOpen) {
                if (isFullscreen) {
                    canType = true;
                    statusText = "MỜI TRẢ LỜI";
                    statusClass = "text-success";
                } else {
                    canType = false;
                    statusText = "LỖI: BẬT FULLSCREEN ĐỂ NHẬP!";
                    statusClass = "text-danger";
                }
            } else {
                canType = false;
                statusText = "ĐANG KHÓA (Hết giờ/Chưa bắt đầu)";
                statusClass = "text-muted";
            }

            input.disabled = !canType;
            if(canType && document.activeElement !== input) input.focus();
            
            st.innerText = statusText;
            st.className = `small text-end mb-2 fw-bold ${statusClass}`;
        }

        // === 4. MEDIA CONTROL ===
        socket.on('mediaControl', (data) => {
            if(myRole === 'VIEWER') {
                if(data.action === 'startTimer') {
                    document.getElementById('vncvTimer').innerText = data.duration;
                    let c = data.duration;
                    const i = setInterval(() => { 
                        c--; 
                        document.getElementById('vncvTimer').innerText = c; 
                        if(c<=0) { clearInterval(i); document.getElementById('vncvTimer').innerText = "HẾT GIỜ"; }
                    }, 1000);
                    
                    const aud = (data.duration===15) ? document.getElementById('sfxTimer15') : document.getElementById('sfxTimer30');
                    if(aud){ aud.currentTime=0; aud.play().catch(e=>console.log(e)); }

                } else if (data.action === 'stop') {
                    document.getElementById('vncvTimer').innerText = "";
                    document.getElementById('sfxTimer15').pause(); 
                    document.getElementById('sfxTimer30').pause();
                }
            }
        });

        // === 5. CÁC HÀM GỬI LỆNH ===
        function submitVncvAnswer() { 
            socket.emit('submitAnswer', { roomId: myRoomId, answer: document.getElementById('answerInput').value }); 
        }
        function requestFullscreen() { document.documentElement.requestFullscreen(); }
        function controlMedia(a, d) { socket.emit('controlMedia', {roomId: myRoomId, action: a, duration: d}); }

    </script>
</body>
</html>
