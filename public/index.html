<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; padding: 20px;}
        
        /* VIEWER SCREEN */
        #viewerContainer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; }
        #viewerBg { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #viewerContent { position: absolute; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #viewerQuestion { background: rgba(0,0,139,0.95); color: white; padding: 40px; font-size: 3.5rem; border-radius: 20px; text-align: center; max-width: 90%; border: 5px solid gold; box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
        #viewerTimer { font-size: 8rem; color: #ff3b3b; font-weight: 900; margin-top: 30px; text-shadow: 3px 3px 0 white; }

        /* PLAYER SCREEN */
        #playerGameScreen { display: none; max-width: 800px; margin: 40px auto; }
        .p-question-box { background: #fff; border: 2px solid #0d6efd; padding: 20px; font-size: 1.5rem; font-weight: bold; min-height: 100px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .p-input { height: 60px; font-size: 1.5rem; text-align: center; font-weight: bold; border: 3px solid #ccc; border-radius: 10px; }
        .p-status { font-weight: bold; text-align: right; margin-bottom: 5px; }
        
        /* LOGIN & MODES */
        #modeSelector, #loginForm { max-width: 500px; margin: 50px auto; }
    </style>
</head>
<body>

    <div id="modeSelector" class="card shadow">
        <div class="card-header bg-primary text-white text-center"><h3>CHỌN CHẾ ĐỘ</h3></div>
        <div class="card-body d-grid gap-3">
            <button onclick="showLogin('HOST')" class="btn btn-outline-danger btn-lg">🎛️ HOST (Điều khiển)</button>
            <button onclick="showLogin('MC')" class="btn btn-outline-info btn-lg">🎤 MC</button>
            <button onclick="showLogin('PLAYER')" class="btn btn-outline-success btn-lg">👤 THÍ SINH</button>
            <button onclick="showLogin('VIEWER')" class="btn btn-outline-dark btn-lg">📺 VIEWER (Màn hình lớn)</button>
        </div>
    </div>

    <div id="loginForm" class="card shadow" style="display: none;">
        <div class="card-body">
            <h3 id="loginTitle" class="text-center mb-3">...</h3>
            <input type="text" id="roomId" class="form-control mb-3" placeholder="Tên phòng (VD: OLYMPIA)" value="OLYMPIA">
            <input type="text" id="playerName" class="form-control mb-3" placeholder="Tên của bạn">
            <button class="btn btn-primary w-100 btn-lg" onclick="doJoin()">VÀO PHÒNG</button>
            <button class="btn btn-secondary w-100 mt-2" onclick="location.reload()">Quay lại</button>
        </div>
    </div>

    <div id="hostContainer" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🎛️ HOST CONTROL</h2>
            <button class="btn btn-danger btn-sm" onclick="location.reload()">Thoát</button>
        </div>
        <div class="card border-primary">
            <div class="card-header bg-primary text-white">ĐIỀU KHIỂN: Ô MẠO HIỂM</div>
            <div class="card-body">
                <input type="text" id="vncvQ" class="form-control mb-2" placeholder="Nhập câu hỏi...">
                <button class="btn btn-info mb-3" onclick="socket.emit('updateVncvQuestion', {roomId: myRoomId, text: document.getElementById('vncvQ').value})">Hiện câu hỏi</button>
                
                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-success" onclick="controlMedia('startTimer', 15)">⏱️ 15s (Mở khóa)</button>
                    <button class="btn btn-warning" onclick="controlMedia('startTimer', 30)">⏱️ 30s (Mở khóa)</button>
                    <button class="btn btn-danger" onclick="controlMedia('stop')">⏹️ Dừng/Khóa</button>
                </div>

                <hr>
                <h6>Danh sách trả lời:</h6>
                <ul class="list-group" id="hostAnswerList"></ul>
            </div>
        </div>
    </div>

    <div id="playerGameScreen">
        <h4 id="pNameDisplay" class="text-center mb-4 text-muted">THÍ SINH</h4>
        <div class="card shadow-lg border-primary">
            <div class="card-body">
                <div id="pQuestion" class="p-question-box">Chờ câu hỏi từ Host...</div>
                <div id="inputStatus" class="p-status text-danger">ĐANG KHÓA</div>
                <input type="text" id="answerInput" class="form-control p-input mb-3" placeholder="Nhập đáp án..." disabled>
                <button class="btn btn-primary w-100 btn-lg" onclick="submitAns()">GỬI ĐÁP ÁN</button>
                <div class="mt-3 text-center fw-bold text-success">Đã gửi: <span id="pSubmitted">...</span></div>
            </div>
        </div>
        <div class="text-center mt-3">
            <button class="btn btn-outline-secondary" onclick="document.documentElement.requestFullscreen()">⚠️ BẬT CHẾ ĐỘ TOÀN MÀN HÌNH</button>
        </div>
    </div>

    <div id="viewerContainer">
        <img id="viewerBg" src="/NỀN ĐỢI.jpg" onerror="this.style.display='none'">
        <div id="viewerContent">
            <div id="viewerQuestion">CHỜ CÂU HỎI...</div>
            <div id="viewerTimer"></div>
        </div>
        <audio id="sfxTimer15" src="/timer15.mp3"></audio>
        <audio id="sfxTimer30" src="/timer30.mp3"></audio>
    </div>

    <div id="mcContainer" class="container mt-5" style="display: none;">
        <h1 class="text-center display-1 fw-bold">MC VIEW</h1>
        <div class="alert alert-info display-4 text-center mt-5" id="mcText">...</div>
    </div>

    <script>
        const socket = io();
        let myRole = '', myRoomId = '', myId = '';

        // --- UI LOGIC ---
        function showLogin(role) {
            myRole = role;
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loginTitle').innerText = "Đăng nhập: " + role;
            if(role === 'VIEWER' || role === 'MC' || role === 'HOST') {
                document.getElementById('playerName').style.display = 'none';
            }
        }

        function doJoin() {
            const r = document.getElementById('roomId').value;
            const n = document.getElementById('playerName').value;
            if(!r) return alert("Thiếu tên phòng");
            myRoomId = r;
            
            socket.emit('joinRoom', {
                roomId: r,
                playerName: n || myRole,
                isHost: myRole === 'HOST',
                isViewer: myRole === 'VIEWER',
                isMC: myRole === 'MC'
            });
        }

        // --- SOCKET LOGIC ---
        socket.on('connect', () => myId = socket.id);

        socket.on('errorMessage', (msg) => alert(msg));

        // QUAN TRỌNG: SỰ KIỆN NÀY ĐÃ ĐƯỢC THÊM ĐỂ FIX LỖI
        socket.on('joinSuccess', (data) => {
            // Ẩn form đăng nhập
            document.getElementById('loginForm').style.display = 'none';
            
            // Hiện màn hình tương ứng
            if (data.role === 'host') document.getElementById('hostContainer').style.display = 'block';
            else if (data.role === 'player') {
                document.getElementById('playerGameScreen').style.display = 'block';
                document.getElementById('pNameDisplay').innerText = "Thí sinh: " + document.getElementById('playerName').value;
                // Bật vòng lặp kiểm tra khóa/mở input
                setInterval(checkPlayerLogic, 500); 
            }
            else if (data.role === 'viewer') document.getElementById('viewerContainer').style.display = 'block';
            else if (data.role === 'mc') document.getElementById('mcContainer').style.display = 'block';
        });

        socket.on('updateState', (room) => {
            // HOST LOGIC
            if (myRole === 'HOST') {
                const list = document.getElementById('hostAnswerList');
                list.innerHTML = "";
                for (const pid in room.players) {
                    const p = room.players[pid];
                    if (!p.isHost && !p.isMC) {
                        list.innerHTML += `<li class="list-group-item d-flex justify-content-between">
                            <span>${p.name}</span> <span class="fw-bold text-primary">${p.lastAnswer || "..."}</span>
                        </li>`;
                    }
                }
            }
            // PLAYER LOGIC
            else if (myRole === 'PLAYER') {
                const p = room.players[myId];
                document.getElementById('pQuestion').innerText = room.vncv.question || "Chờ câu hỏi...";
                document.getElementById('pSubmitted').innerText = (p && p.lastAnswer) ? p.lastAnswer : "...";
                window.currentRoomState = room; // Lưu lại state để check logic
            }
            // VIEWER LOGIC
            else if (myRole === 'VIEWER') {
                document.getElementById('viewerQuestion').innerText = room.vncv.question || "";
            }
            // MC LOGIC
            else if (myRole === 'MC') {
                document.getElementById('mcText').innerText = room.vncv.question || "Chờ câu hỏi...";
            }
        });

        socket.on('mediaControl', (data) => {
            if (myRole === 'VIEWER') {
                if (data.action === 'startTimer') {
                    document.getElementById('viewerTimer').innerText = data.duration;
                    let c = data.duration;
                    const i = setInterval(() => {
                        c--; document.getElementById('viewerTimer').innerText = c;
                        if(c<=0) { clearInterval(i); document.getElementById('viewerTimer').innerText = "HẾT GIỜ"; }
                    }, 1000);
                    const aud = document.getElementById(data.duration === 15 ? 'sfxTimer15' : 'sfxTimer30');
                    if(aud) { aud.currentTime=0; aud.play().catch(()=>{}); }
                } else if (data.action === 'stop') {
                    document.getElementById('viewerTimer').innerText = "";
                    document.getElementById('sfxTimer15').pause();
                    document.getElementById('sfxTimer30').pause();
                }
            }
        });

        // --- PLAYER FUNCTIONS ---
        function submitAns() {
            socket.emit('submitAnswer', { roomId: myRoomId, answer: document.getElementById('answerInput').value });
        }
        function controlMedia(a, d) {
            socket.emit('controlMedia', { roomId: myRoomId, action: a, duration: d });
        }

        // Logic kiểm tra khóa/mở input thí sinh
        function checkPlayerLogic() {
            const room = window.currentRoomState;
            if (!room) return;

            const input = document.getElementById('answerInput');
            const st = document.getElementById('inputStatus');
            let canType = false;
            let statusText = "ĐANG KHÓA";
            let statusClass = "text-danger";

            // Server mở + Đang Fullscreen -> Mới được nhập
            const serverOpen = (room.answerMode === 'unlocked' && room.vncv.isInputOpen);
            const isFullscreen = document.fullscreenElement != null;

            if (serverOpen) {
                if (isFullscreen) {
                    canType = true; statusText = "MỜI TRẢ LỜI"; statusClass = "text-success";
                } else {
                    statusText = "BẬT FULLSCREEN ĐỂ NHẬP!";
                }
            }

            input.disabled = !canType;
            if (canType && document.activeElement !== input) input.focus();
            st.innerText = statusText;
            st.className = `p-status ${statusClass}`;
        }
    </script>
</body>
</html>
